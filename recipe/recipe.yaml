context:
  name: "jupyter-sphinx"
  package: "jupyter_sphinx"
  version: 0.5.3

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ package }}-${{ version }}.tar.gz
  sha256: 2e23699a3a1cf5db31b10981da5aa32606ee730f6b73a844d1e76d800756af56

build:
  number: 6

outputs:
  - package:
      name: ${{ name }}
    build:
      script: python -m pip install . -vv --no-deps --ignore-installed
      noarch: python
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - hatchling
      run:
        - python >=${{ python_min }}
        - ipykernel >=4.5.1
        - ipython
        - ipywidgets >=7.0.0
        - nbconvert >=5.5
        - nbformat
        - sphinx >=7
    tests:
      - python:
          imports:
            - jupyter_sphinx
          python_version: ['${{ python_min }}.*']

  # alias to deprecate the jupyter_sphinx feedstock
  - package:
      name: jupyter_sphinx
    build:
      noarch: python
    requirements:
      run:
        - ${{ pin_subpackage(name, exact=True) }}
    tests:
      - python:
          imports:
            - jupyter_sphinx
          python_version: ['${{ python_min }}.*']

about:
  homepage: https://github.com/jupyter/jupyter-sphinx/
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Sphinx extension for rendering of Jupyter interactive widgets.
  documentation: https://jupyter-sphinx.readthedocs.io/

extra:
  recipe-maintainers:
    - akhmerov
    - chrisjsewell
    - 12rambau
